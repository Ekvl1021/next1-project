openapi: 3.0.3
info:
  title: 'University API'
  version: 1.0.0
  description: 'JSON файлд суурилсан сургалтын API. Authorize хэсэгт JWT token-оо Bearer угтваргүй оруулна. Course нь төслийн title, teacher, schedule, room талбаруудыг ашиглана. Lab 8: Student CRUD uses MongoDB. Student API id is a positive integer; _id is ObjectId. GET/POST/PUT require admin or teacher; DELETE requires admin.'
servers:
  -
    url: http://localhost:3002
    description: 'University API backend'
security:
  -
    BearerAuth: []
tags:
  -
    name: Authentication
  -
    name: Students
    description: >-
      Оюутны бүртгэл: оюутны код, овог нэр, имэйл болон суралцаж буй хөтөлбөрийн мэдээлэл.
      Жагсаалтыг хайлт болон хуудсаар харуулах боломжтой.
  -
    name: Courses
    description: >-
      Хичээлийн нэр, багш, хуваарь болон орох өрөөний мэдээлэл.
      Оюутны сонголтыг Course Selections endpoint-оор админ зөвшөөрнө.
  -
    name: Course Selections
    description: >-
      Оюутны хичээл сонгох хүсэлт. Админ зөвшөөрсний дараа хичээл тухайн багшийн
      хуваарьт баталгаажсан оюутантайгаа харагдана.
  -
    name: Departments
    description: >-
      Их сургуулийн тэнхимүүдийн бүртгэл болон тэнхимийн нэрийн мэдээлэл.
  -
    name: Rooms
    description: >-
      Хичээл орох анги, өрөөнүүдийн бүртгэл болон өрөөний нэрийн мэдээлэл.
  -
    name: Teachers
    description: >-
      Багшийн бүртгэл: хэрэглэгчийн нэр болон багшийн role-ийн мэдээлэл.
      Нууц үг API response-д ил гарахгүй.
  -
    name: Planner
    description: >-
      Нэвтэрсэн хэрэглэгчийн хуваарь, даалгавар, дүнгийн хувийн төлөвлөгөө.
      Бусад хэрэглэгчийн төлөвлөгөөг харах, өөрчлөх боломжгүй.
  -
    name: Attendance
    description: >-
      Хичээлийн ирц. Багш зөвхөн өөрийн хичээлд бүртгэж, оюутан зөвхөн
      өөрийн ирцийн мэдээллийг харна.
  -
    name: Diagnostics
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CourseInput:
      type: object
      required:
        - title
        - teacher
        - schedule
        - room
      properties:
        title:
          type: string
          minLength: 1
          example: 'Веб систем ба технологи'
        teacher:
          type: string
          minLength: 1
          example: teacher1
        schedule:
          type: string
          minLength: 1
          example: 'Monday 10:00'
        room:
          type: string
          minLength: 1
          example: A-301
    CourseUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          example: 'Веб систем ба технологи'
        teacher:
          type: string
          minLength: 1
          example: teacher1
        schedule:
          type: string
          minLength: 1
          example: 'Monday 10:00'
        room:
          type: string
          minLength: 1
          example: A-301
    Course:
      allOf:
        -
          $ref: '#/components/schemas/CourseInput'
        -
          type: object
          properties:
            id:
              type: string
              example: '1795156404930'
    Error:
      type: object
      properties:
        message:
          type: string
          example: 'Оюутан олдсонгүй'
        errors:
          type: array
          items:
            type: string
      example:
        message: 'Оюутан олдсонгүй'
    User:
      type: object
      properties:
        id:
          oneOf:
            -
              type: integer
            -
              type: string
        username:
          type: string
        role:
          type: string
          enum:
            - admin
            - teacher
            - student
      example:
        id: 2
        username: teacher1
        role: teacher
    Login:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: Admin123!
    Session:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    StudentInput:
      type: object
      required:
        - code
        - firstName
        - lastName
        - email
      additionalProperties: false
      properties:
        code:
          type: string
          example: ST2026099
        firstName:
          type: string
          example: Номин
        lastName:
          type: string
          example: Бат
        email:
          type: string
          format: email
          example: nomin99@example.com
        program:
          type: string
          example: 'Мэдээллийн технологи'
        courseId:
          type: string
          example: '1795156404930'
        selectedCourses:
          type: array
          description: 'Сонголтоо хийсэн оюутны хичээлүүд; admin болон teacher-д жагсаалтаар харагдана.'
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: string
              title:
                type: string
    StudentPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          example: ST2026099
        firstName:
          type: string
          minLength: 1
          example: Номин
        lastName:
          type: string
          minLength: 1
          example: Бат
        email:
          type: string
          format: email
          example: nomin99@example.com
        program:
          type: string
          example: 'Мэдээллийн технологи'
        courseId:
          type: string
          example: '1795156404930'
    Student:
      type: object
      properties:
        code:
          type: string
          example: ST2026099
        firstName:
          type: string
          example: Номин
        lastName:
          type: string
          example: Бат
        email:
          type: string
          format: email
          example: nomin99@example.com
        program:
          type: string
        courseId:
          type: string
        id:
          type: integer
          minimum: 1
          readOnly: true
          example: 10
        _id:
          type: string
          readOnly: true
          description: 'MongoDB ObjectId, separate from API id'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 10
        code: ST2026010
        firstName: 'Саруул'
        lastName: 'Эрдэнэ'
        email: saruul@example.com
        program: 'Мэдээллийн технологи'
        courseId: '1795156404930'
        _id: 6affc4eaf96538c20d9b25cb
        createdAt: '2026-11-25T10:00:00.000Z'
        updatedAt: '2026-11-25T10:00:00.000Z'
    StudentResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Student'
      example:
        success: true
        data:
          id: 10
          code: ST2026010
          firstName: 'Саруул'
          lastName: 'Эрдэнэ'
          email: saruul@example.com
          program: 'Мэдээллийн технологи'
          courseId: '1795156404930'
    StudentList:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            pages:
              type: integer
      example:
        success: true
        data:
          - id: 10
            code: ST2026010
            firstName: 'Саруул'
            lastName: 'Эрдэнэ'
            email: saruul@example.com
          - id: 11
            code: ST2026011
            firstName: 'Тэмүүлэн'
            lastName: 'Бат'
            email: temuulen@example.com
          - id: 20
            code: ST2026020
            firstName: 'Номин'
            lastName: 'Бат'
            email: nomin@example.com
          - id: 21
            code: ST2026021
            firstName: 'Ананд'
            lastName: 'Дорж'
            email: anand@example.com
          - id: 22
            code: ST2026022
            firstName: 'Мишээл'
            lastName: 'Ган'
            email: mysheel@example.com
        pagination:
          page: 1
          limit: 5
          total: 5
          pages: 1
    DepartmentInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: 'Хэрэглээний математик'
    Department:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          example: 1
        name:
          type: string
          example: 'Мэдээллийн технологи'
    Room:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: '4'
        name:
          type: string
          example: A-301
    RoomInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: D-401
    TeacherInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          example: teacher2
        password:
          type: string
          format: password
          minLength: 8
          example: 'StrongPass123!'
    TeacherUpdate:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          example: teacher2
        password:
          type: string
          format: password
          minLength: 8
          example: 'StrongPass123!'
    TeacherPatch:
      type: object
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 1
          example: teacher2
        password:
          type: string
          format: password
          minLength: 8
          example: 'StrongPass123!'
    CourseSelection:
      type: object
      required: [id, studentId, studentName, studentCode, courseId, course, status, createdAt]
      properties:
        id:
          type: string
        studentId:
          type: string
        studentName:
          type: string
        studentCode:
          type: string
        courseId:
          type: string
        course:
          $ref: '#/components/schemas/Course'
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
    Planner:
      type: object
      required: [schedule, tasks, grades]
      additionalProperties: false
      properties:
        schedule:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, title, day, start, end, room]
            properties:
              id:
                type: string
                example: class-1
              title:
                type: string
                example: 'Веб систем ба технологи'
              day:
                type: integer
                minimum: 0
                maximum: 6
                description: '0=Даваа, 1=Мягмар, ..., 6=Ням'
                example: 1
              start:
                type: string
                pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                example: '10:00'
              end:
                type: string
                pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                example: '11:30'
              room:
                type: string
                example: A-301
        tasks:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, title, due, priority, done, kind]
            properties:
              id:
                type: string
                example: task-1
              title:
                type: string
                example: 'Лабораторийн ажил 8'
              due:
                type: string
                format: date
                example: '2026-12-01'
              priority:
                type: string
                enum: [low, normal, high]
                example: normal
              done:
                type: boolean
                example: false
              kind:
                type: string
                enum: [assignment, exam, personal]
                example: assignment
        grades:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, title, credits, score, letter, point, term]
            properties:
              id:
                type: string
                example: grade-1
              title:
                type: string
                example: 'Веб систем ба технологи'
              credits:
                type: number
                minimum: 0
                exclusiveMinimum: true
                maximum: 30
                example: 3
              score:
                type: number
                minimum: 0
                maximum: 100
                example: 92
              letter:
                type: string
                enum: [A+, A, B+, B, C+, C, D+, D, F]
                example: A
              point:
                type: number
                minimum: 0
                maximum: 4
                example: 3.7
              term:
                type: string
                example: '2026 Fall'
      example:
        schedule:
          - id: class-1
            title: 'Веб систем ба технологи'
            day: 1
            start: '10:00'
            end: '11:30'
            room: A-301
        tasks:
          - id: task-1
            title: 'Лабораторийн ажил 8'
            due: '2026-12-01'
            priority: normal
            done: false
            kind: assignment
        grades:
          - id: grade-1
            title: 'Веб систем ба технологи'
            credits: 3
            score: 92
            letter: A
            point: 3.7
            term: '2026 Fall'
    AttendanceRecord:
      type: object
      required: [courseId, courseTitle, studentCode, studentName, date, status]
      properties:
        courseId:
          type: string
        courseTitle:
          type: string
        studentCode:
          type: string
        studentName:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
          enum: [present, absent, late, excused]
      example:
        courseId: '1795156403671'
        courseTitle: 'Веб систем ба технологи'
        studentCode: ST2026010
        studentName: 'Эрдэнэ Саруул'
        date: '2026-11-25'
        status: present
    AttendanceList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
    AttendanceUpsert:
      type: object
      required: [courseId, date, entries]
      properties:
        courseId:
          type: string
          example: '1795156403671'
        date:
          type: string
          format: date
          example: '2026-11-25'
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [studentCode, status]
            properties:
              studentCode:
                type: string
              status:
                type: string
                nullable: true
                enum: [present, absent, late, excused]
                description: 'null илгээвэл тухайн өдрийн өмнөх бүртгэлийг цуцална.'
paths:
  /students:
    get:
      tags: [Students]
      summary: 'Бүх оюутны мэдээлэл авах'
      description: 'Alias for /api/students.'
      responses:
        '200':
          description: Students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentList'
        '401':
          description: Missing, invalid or expired JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/students/{id}':
    parameters:
      -
        name: id
        in: path
        required: true
        description: Student API id
        schema:
          type: integer
          minimum: 1
        example: 1
    get:
      tags: [Students]
      summary: 'Тухайн id бүхий оюутны мэдээлэл авах'
      description: 'Alias for /api/students/{id}.'
      responses:
        '200':
          description: Student information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResult'
        '400':
          description: Invalid student id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Students]
      summary: 'Оюутны сонгосон талбарыг шинэчлэх'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResult'
        '400':
          description: Invalid student id or patch body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate code or email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: 'Нэвтрэх / JWT авах'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: 'Logged in'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: 'Invalid request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Authentication required or invalid/expired token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: 'Нийтийн бүртгэлийг хориглох'
      description: 'Гадны хэрэглэгч бүртгүүлэх боломжгүй. Бүртгэл MongoDB users collection-д удирдлагын бүртгэлээр хийгдэнэ.'
      security: []
      responses:
        '403':
          description: 'Public registration is disabled'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/teachers:
    get:
      tags: [Teachers]
      summary: 'Багш нарын жагсаалт'
      responses:
        '200':
          description: Teachers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              example:
                - id: 2
                  username: teacher1
                  role: teacher
                - id: 4
                  username: rege
                  role: teacher
                - id: 5
                  username: Mijiddorj
                  role: teacher
                - id: 6
                  username: Ulambayar
                  role: teacher
                - id: 7
                  username: 'Б. Энхтүвшин'
                  role: teacher
                - id: 8
                  username: 'Д. Мөнхзул'
                  role: teacher
                - id: 9
                  username: 'Ц. Тэмүүлэн'
                  role: teacher
                - id: 10
                  username: 'Н. Ариунболд'
                  role: teacher
                - id: 11
                  username: 'С. Оюунгэрэл'
                  role: teacher
                - id: 12
                  username: 'Г. Бат-Эрдэнэ'
                  role: teacher
                - id: 13
                  username: 'Э. Номин'
                  role: teacher
                - id: 14
                  username: 'Л. Ганболд'
                  role: teacher
        '401':
          description: Authentication required or invalid/expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Teachers]
      summary: 'Багшийн бүртгэл үүсгэх (admin)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherInput'
      responses:
        '201':
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid teacher data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/teachers/{id}':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Teachers]
      summary: 'Багшийн мэдээлэл'
      responses:
        '200':
          description: Teacher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid teacher id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Teacher not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Teachers]
      summary: 'Багшийн username засах (admin); нууц үг шинэчлэх бол мөн илгээнэ'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherUpdate'
      responses:
        '200':
          description: Teacher updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid teacher data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
