    post:
      tags: [Course Selections]
      summary: 'Хичээл сонгох хүсэлт илгээх'
      description: 'Оюутны сонголт админд хүлээгдэж буй төлөвөөр очно.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId]
              properties:
                courseId:
                  type: string
                  pattern: '^[1-9]\d*$'
      responses:
        '201':
          description: 'Хүлээгдэж буй сонголтын хүсэлт'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSelection'
        '400':
          description: 'Хичээлийн ID буруу'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Зөвхөн оюутан хүсэлт илгээнэ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/course-selections/{courseId}:
    delete:
      tags: [Course Selections]
      summary: 'Хичээл сонголтоо цуцлах'
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'Сонголт цуцлагдлаа'
        '403':
          description: 'Зөвхөн оюутан сонголтоо цуцална'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/course-selections/{studentId}/{courseId}:
    patch:
      tags: [Course Selections]
      summary: 'Сонголтын хүсэлтийг зөвшөөрөх эсвэл татгалзах'
      description: 'Зөвшөөрсөн хүсэлт тухайн хичээлийн багшийн хуваарьт орно.'
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
      responses:
        '200':
          description: 'Шинэчилсэн хүсэлт'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSelection'
        '403':
          description: 'Зөвхөн админ шийдвэрлэнэ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/planner:
    get:
      tags: [Planner]
      summary: 'Өөрийн төлөвлөгөөг харах'
      description: 'Хуваарь, даалгавар, дүнг нэвтэрсэн хэрэглэгчээр тусгаарлан буцаана. Өгөгдөл байхгүй үед хоосон массивууд ирнэ.'
      responses:
        '200':
          description: 'Хэрэглэгчийн төлөвлөгөө'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planner'
        '401':
          description: 'Нэвтрэх шаардлагатай'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Planner]
      summary: 'Өөрийн төлөвлөгөөг хадгалах'
      description: 'schedule, tasks, grades гурвыг бүхэлд нь илгээнэ. Нэг бүртгэлийн ID давхцахгүй, бүлэг бүр 200 хүртэл мөртэй байна. grades.score нь 0–100 хувь; letter болон point серверээс автоматаар бодогдоно.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Planner'
      responses:
        '200':
          description: 'Хадгалсан төлөвлөгөө'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planner'
        '400':
          description: 'Төлөвлөгөөний өгөгдлийн бүтэц эсвэл талбар буруу'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Нэвтрэх шаардлагатай'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/attendance:
    get:
      tags: [Attendance]
      summary: 'Ирц харах'
      description: 'Оюутан зөвхөн өөрийн ирцийг, багш зөвхөн өөрийн хичээлийн ирцийг, админ бүх ирцийг харна.'
      parameters:
        - name: courseId
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 'Хандах эрхийн хүрээнд харуулах ирц'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceList'
        '401':
          description: 'Нэвтрэх шаардлагатай'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Багш зөвхөн өөрийн хичээлээ харах боломжтой'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Attendance]
      summary: 'Хичээлийн ирц бүртгэх'
      description: 'Админ бүх хичээлд, багш зөвхөн өөрийн хичээлд ирц бүртгэнэ. Оюутан бүртгэх эрхгүй.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceUpsert'
      responses:
        '200':
          description: 'Хадгалсан ирцийн бүртгэл'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceList'
        '400':
          description: 'Огноо, хичээл, оюутан эсвэл ирцийн төлөв буруу'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Нэвтрэх шаардлагатай'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Энэ хэрэглэгчид ирц бүртгэх эрх байхгүй'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
