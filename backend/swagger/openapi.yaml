      summary: 'Өөрийн сонгосон хичээлүүд'
      description: >-
        Хуучин клиентүүдтэй нийцэхийн тулд хадгалсан legacy endpoint.
        Шинэ хүсэлтээ илгээж админаар зөвшөөрүүлэхдээ /api/course-selections-г ашиглана.
      responses:
        '200':
          description: 'Сонгосон хичээлийн ID-ууд'
          content:
            application/json:
              schema:
                type: object
                properties:
                  courseIds:
                    type: array
                    items:
                      type: string
              example:
                courseIds:
                  - '1795156404930'
                  - '1795156404931'
        '401':
          description: 'Missing, invalid or expired JWT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Only students can manage their selections'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Courses]
      summary: 'Legacy сонгосон хичээлийн жагсаалт шинэчлэх'
      description: 'Зөвшөөрлийн урсгал ашиглах шинэ интерфэйс энэ endpoint-ийг дуудахгүй.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseIds
              properties:
                courseIds:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
            example:
              courseIds:
                - '1795156404930'
                - '1795156404931'
      responses:
        '200':
          description: 'Сонголт хадгалагдлаа'
          content:
            application/json:
              schema:
                type: object
                properties:
                  courseIds:
                    type: array
                    items:
                      type: string
              example:
                courseIds:
                  - '1795156404930'
                  - '1795156404931'
        '400':
          description: 'Invalid course IDs'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, invalid or expired JWT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Only students can manage their selections'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
